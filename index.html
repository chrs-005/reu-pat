<body>
<div class="app">
 <header class="top"><div><div class="eyebrow">GAME PLANNER</div><h1>Five-Team Riddle Quest</h1><p class="sub">5 teams · 8 → 4 → 2 → 1 · locations & attendance</p></div><div class="actions"><button class="btn" id="importBtn">Import</button><button class="btn" id="exportBtn">Backup</button><button class="btn primary" id="printBtn">Print</button></div></header>
 <nav class="tabs" id="tabs" aria-label="Teams"></nav>

 <main class="layout">
  <section class="panel"><div class="bar"><div><h2 id="teamTitle">Team 1</h2><div class="small">Choose a location; occupied places swap automatically.</div></div><div class="settings"><button class="btn" id="pasteBtn">Paste 8 units</button><button class="btn" id="balanceBtn">Balance pairs</button></div></div><div class="bracketScroll"><div class="colhead"><div>Start · 8 units</div><div>Round 1 · 4 meets</div><div>Round 2 · 2 meets</div><div>Final · 1 meet</div></div><div class="bracket" id="bracket"></div></div></section>
  <aside class="panel edit" id="editor"></aside>
 </main>
 <div class="summary" id="summary"></div>
 <section class="panel footbox locationBoard" id="locationBoard"></section>
 <section class="panel footbox" id="plan"></section>

</div>
<div class="printArea" id="printArea"></div>
<div class="modalOverlay hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><h2 id="modalTitle"></h2><p id="modalHelp"></p><textarea id="modalText"></textarea><p id="modalStatus"></p><footer><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalApply">Apply</button></footer></div></div>

<script>
(()=>{'use strict';
const STORE='riddle-quest-five-trees-simple-locations-v5', LAST='riddle-quest-five-trees-location-capacity-v4', PREVIOUS='riddle-quest-five-trees-fullnames-v3', LEGACY='riddle-quest-five-trees-with-rosters-v2', OLDER='riddle-quest-five-trees-with-rosters-v1';
const icons=['★','◆','●','▲','■','♥','☀','☾','☁','☘','♣','♠','♜','⚑','⚓','⚙','✿','✪','✧','✚','✖','◈','⬟','⬢','◉','◎','☯','☮','♫','☕','☂','☎','✈','✉','☺'];
const meetings=[8,9,10,11,12,13,14],parents=[8,8,9,9,10,10,11,11,12,12,13,13,14,14,null];
const PLACES=['Ping pong','CP','Hangar 7e','Chapelle','Dekken','Grafiti','Salle de ballet','Lougha','CE1','Cherokee'];
const ROUND_LIMIT={1:2,2:1,3:1};
const ROUND_NAMES={1:'Round 1',2:'Round 2',3:'Final'};
const roundOf=id=>id<12?1:id<14?2:3;
const pairSequence=[['Elie Harb','Jason Rahme'],['Selim Irani','Serge Mansour','Joe Bsaibes'],['Alex Kiriakos','Andrew Zaytoun'],['Georges Ibrahim'],['Anthony Hayek','Christopher Hage']];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const children=id=>id<12?[2*(id-8),2*(id-8)+1]:id<14?[8+(id-12)*2,9+(id-12)*2]:[12,13];
const unitNames=u=>String(u.names||'').split(/\n|\s*;\s*/).map(s=>s.trim()).filter(Boolean);
const fullNames=t=>t.units.flatMap(unitNames);
const label=id=>id<8?'Starting unit '+(id+1):id<12?'Round 1 · Meeting '+(id-7):id<14?'Round 2 · Meeting '+(id-11):'Final reunion';
const list=a=>a.length?a.join(', '):'—';
const h=s=>esc(s||'—').replace(/\n/g,'<br>');
const formatSymbol=m=>esc(m?.symbol||'Not set');
const table=(rows,heads)=>`<table><thead><tr>${heads.map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table>`;
const PREFILLED={"teams":[{"name":"Star","units":[{"names":"Elie Harb\nMathieu Chabab","note":"Starting location: Administration"},{"names":"Makram Abou Monsef","note":"Starting location: Administration"},{"names":"Vladimir Bsaibes","note":"Starting location: Chapelle"},{"names":"Andrew Kiriakos","note":"Starting location: Chapelle"},{"names":"Jason Rahme\nJohn Abi Rizk","note":"Starting location: Bus"},{"names":"Rapha Germanos","note":"Starting location: Bus"},{"names":"Matheo El Khoury","note":"Starting location: Ballet"},{"names":"Kevin Rouphael","note":"Starting location: Ballet"}],"meetings":{"8":{"symbol":"★","location":"Administration","riddle":"","instructions":""},"9":{"symbol":"◆","location":"Chapelle","riddle":"","instructions":""},"10":{"symbol":"●","location":"Bus","riddle":"","instructions":""},"11":{"symbol":"▲","location":"Ballet","riddle":"","instructions":""},"12":{"symbol":"■","location":"Jardin","riddle":"","instructions":""},"13":{"symbol":"♥","location":"Lougha","riddle":"","instructions":""},"14":{"symbol":"☀","location":"WC7E","riddle":"","instructions":""}},"finish":"Congratulations! You have reunited your whole team."},{"name":"Cercle","units":[{"names":"Selim Irani\nRoy Sassine","note":""},{"names":"Marc Abi Nassif","note":""},{"names":"Joe Bsaibes\nMarc Haroun","note":""},{"names":"Eli Tebcherani","note":""},{"names":"Serge Mansour\nJimmy Hachem","note":""},{"names":"Ivan Bitar","note":""},{"names":"Cyril Koussa","note":""},{"names":"Georges Feghali","note":""}],"meetings":{"8":{"symbol":"☾","location":"","riddle":"","instructions":""},"9":{"symbol":"☁","location":"","riddle":"","instructions":""},"10":{"symbol":"☘","location":"","riddle":"","instructions":""},"11":{"symbol":"♣","location":"","riddle":"","instructions":""},"12":{"symbol":"♠","location":"","riddle":"","instructions":""},"13":{"symbol":"♜","location":"","riddle":"","instructions":""},"14":{"symbol":"⚑","location":"","riddle":"","instructions":""}},"finish":"Congratulations! You have reunited your whole team."},{"name":"Triangle","units":[{"names":"Alex Kiriakos\nRay Abboud","note":""},{"names":"Jad Saad","note":""},{"names":"Marc Sarrouh","note":""},{"names":"Georges Abboud","note":""},{"names":"Andrew Zaytoun\nRon Abi Mansour","note":""},{"names":"Nicolas Njeim","note":""},{"names":"Charbel Hayek","note":""},{"names":"Julien Nicolas","note":""}],"meetings":{"8":{"symbol":"⚓","location":"","riddle":"","instructions":""},"9":{"symbol":"⚙","location":"","riddle":"","instructions":""},"10":{"symbol":"✿","location":"","riddle":"","instructions":""},"11":{"symbol":"✪","location":"","riddle":"","instructions":""},"12":{"symbol":"✧","location":"","riddle":"","instructions":""},"13":{"symbol":"✚","location":"","riddle":"","instructions":""},"14":{"symbol":"✖","location":"","riddle":"","instructions":""}},"finish":"Congratulations! You have reunited your whole team."},{"name":"Carré","units":[{"names":"Georges Ibrahim\nFrancois Beaini","note":""},{"names":"Jean Paul Safa","note":""},{"names":"Oliver Sleiman","note":""},{"names":"Paul Obeid","note":""},{"names":"Pierre Abi Habib","note":""},{"names":"Ralph Kazzour","note":""},{"names":"Kevin Nehme","note":""},{"names":"Charbel Abou Faycal","note":""}],"meetings":{"8":{"symbol":"◈","location":"","riddle":"","instructions":""},"9":{"symbol":"⬟","location":"","riddle":"","instructions":""},"10":{"symbol":"⬢","location":"","riddle":"","instructions":""},"11":{"symbol":"◉","location":"","riddle":"","instructions":""},"12":{"symbol":"◎","location":"","riddle":"","instructions":""},"13":{"symbol":"☯","location":"","riddle":"","instructions":""},"14":{"symbol":"☮","location":"","riddle":"","instructions":""}},"finish":"Congratulations! You have reunited your whole team."},{"name":"Umbrella","units":[{"names":"Anthony Hayek\nGabriel Nader","note":""},{"names":"Alexandre Sleiman","note":""},{"names":"Kevin Hanna","note":""},{"names":"Anthony Kiriakos","note":""},{"names":"Christopher Hage\nSam Mansour Salameh","note":""},{"names":"Karim Ghsoub","note":""},{"names":"Alex Zwein","note":""},{"names":"Rayen Hayek","note":""}],"meetings":{"8":{"symbol":"♫","location":"","riddle":"","instructions":""},"9":{"symbol":"☕","location":"","riddle":"","instructions":""},"10":{"symbol":"☂","location":"","riddle":"","instructions":""},"11":{"symbol":"☎","location":"","riddle":"","instructions":""},"12":{"symbol":"✈","location":"","riddle":"","instructions":""},"13":{"symbol":"✉","location":"","riddle":"","instructions":""},"14":{"symbol":"☺","location":"","riddle":"","instructions":""}},"finish":"Congratulations! You have reunited your whole team."}]};
function fresh(){return JSON.parse(JSON.stringify(PREFILLED))}
const FULL_NAMES=[{"elie harb":"Elie Harb","mathieu":"Mathieu Chabab","makram":"Makram Abou Monsef","vladimir":"Vladimir Bsaibes","andrew kiriakos":"Andrew Kiriakos","jasom rahme":"Jason Rahme","jhon abi rizk":"John Abi Rizk","rapha":"Rapha Germanos","matheo":"Matheo El Khoury","roupheal":"Kevin Rouphael"},{"selim":"Selim Irani","roy sessine":"Roy Sassine","marc":"Marc Abi Nassif","joe bsaibes":"Joe Bsaibes","marc haroun":"Marc Haroun","ely":"Eli Tebcherani","serge":"Serge Mansour","jimmy":"Jimmy Hachem","yvan":"Ivan Bitar","koussa":"Cyril Koussa","feghali":"Georges Feghali"},{"alex kirikos":"Alex Kiriakos","ray abboud":"Ray Abboud","jado":"Jad Saad","marc":"Marc Sarrouh","abboud":"Georges Abboud","ditto":"Andrew Zaytoun","ron":"Ron Abi Mansour","nix":"Nicolas Njeim","charbel":"Charbel Hayek","julien":"Julien Nicolas"},{"geogres":"Georges Ibrahim","beini":"Francois Beaini","jp":"Jean Paul Safa","oliver":"Oliver Sleiman","paul":"Paul Obeid","abi habib":"Pierre Abi Habib","kazzour":"Ralph Kazzour","kevin nehme":"Kevin Nehme","bouli":"Charbel Abou Faycal"},{"anthony hayek":"Anthony Hayek","gabriel":"Gabriel Nader","alex sleiman":"Alexandre Sleiman","kevin hanna":"Kevin Hanna","anthony kiriakos":"Anthony Kiriakos","christopher":"Christopher Hage","sam mansour":"Sam Mansour Salameh","karim":"Karim Ghsoub","alex":"Alex Zwein","ryan hayek":"Rayen Hayek"}];
function upgradeNames(d){
 d.teams.forEach((t,i)=>{
  const lookup=FULL_NAMES[i];
  const fix=(name)=>lookup[String(name).trim().toLowerCase()]||name;
  t.units.forEach(u=>{u.names=String(u.names||'').split('\n').map(fix).join('\n');});
  if(Array.isArray(t.absent))t.absent=t.absent.map(fix);
 });
 return d;
}

function valid(d){return d&&Array.isArray(d.teams)&&d.teams.length===5&&d.teams.every(t=>t&&Array.isArray(t.units)&&t.units.length===8&&t.meetings&&meetings.every(i=>t.meetings[i]));}
let data=fresh();
const hasSimpleSave=!!localStorage.getItem(STORE);
try{const current=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(LAST)||localStorage.getItem(PREVIOUS)||localStorage.getItem(LEGACY)||localStorage.getItem(OLDER));if(valid(current))data=upgradeNames(current);}catch{}
data.teams.forEach(t=>{if(!Array.isArray(t.absent))t.absent=[];});
// Deterministic initial bookings across all five teams: 20 / 10 / 5 meetings.
// Each Round 1 place hosts exactly 2 meetups, each Round 2 place hosts 1.
const ORDER=['Salle de ballet','Hangar 7e','Cherokee','Ping pong','Lougha','Dekken','CP','CE1','Grafiti','Chapelle'];
function assignInitialLocations(d){
 d.teams.forEach((t,ti)=>{
  t.units.forEach(u=>{u.note=''});
  meetings.forEach(id=>{
   const m=t.meetings[id];
   m.riddle='';m.instructions='';
   const index=id<12?(ti*4+id-8)%10:id<14?(ti*2+id-12+3)%10:(ti*2+7)%10;
   m.location=ORDER[index];
  });
 });
 return d;
}
function normalizePlaces(d){
 d.teams.forEach(t=>{
  t.units.forEach(u=>{u.note=''});
  meetings.forEach(id=>{
   const m=t.meetings[id];

if(!hasSimpleSave)assignInitialLocations(data);

function usesAt(round,place,excludeTeam=-1,excludeId=-1){
 const used=[];
 if(!place)return used;
 data.teams.forEach((t,ti)=>{
  const s=derive(t,ti);
  s.liveMeetings.forEach(id=>{
   if(roundOf(id)===round&&t.meetings[id].location===place&&!(ti===excludeTeam&&id===excludeId))used.push({ti,id});
  });
 });
 return used;
}
// On attendance changes/import, recheck capacity across all teams.
// Conflicting placements are cleared rather than silently allowing over-capacity meetings.
let reassignmentWarnings=[];
function reconcileLocations(){
 reassignmentWarnings=[];
 for(const round of [1,2,3])for(const place of PLACES){
  const matches=usesAt(round,place);
  const cap=ROUND_LIMIT[round];
  if(matches.length>cap){
   matches.slice(cap).forEach(({ti,id})=>{
    const m=data.teams[ti].meetings[id];
    m.location='';
    reassignmentWarnings.push(data.teams[ti].name+' '+label(id)+' needs a new location; '+place+' was fully booked.');
   });
  }
 }
}

let active=0, selection=0, modalApply=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){console.warn('Could not save locally',e)}}
function derive(t,ti){
 const absent=new Set(t.absent||[]);
 const units=t.units.map(u=>unitNames(u).filter(n=>!absent.has(n)));
 const moved=[];const empty=()=>units.map((u,i)=>u.length?null:i).filter(i=>i!==null);
 const rank=i=>{const origin=unitNames(t.units[i])[0]||'';const p=pairSequence[ti].indexOf(origin);return p<0?-1:p};
 for(const target of empty()){
  const candidates=units.map((u,i)=>u.length===2?i:-1).filter(i=>i!==-1&&i!==target);
  if(!candidates.length)break;
  candidates.sort((a,b)=>rank(b)-rank(a)||b-a);
  const from=candidates[0], person=units[from][1];
  units[from]=[units[from][0]];units[target]=[person];
  moved.push({person,from,to:target,remaining:units[from][0]});
 }
 const subtree=id=>id<8?units[id]:children(id).flatMap(subtree);
 const nodePeople=Array.from({length:15},(_,i)=>subtree(i));
 const activeMeeting=id=>id>=8&&children(id).every(k=>nodePeople[k].length>0);
 const nextMeeting=id=>{for(let p=parents[id];p!==null;p=parents[p])if(activeMeeting(p))return p;return null};
 const liveMeetings=meetings.filter(activeMeeting);
 const first=units.map((u,i)=>u.length?nextMeeting(i):null);
 const skipped=meetings.filter(id=>!activeMeeting(id));
 const byes=meetings.filter(id=>children(id).filter(k=>nodePeople[k].length>0).length===1);
 const available=units.reduce((s,u)=>s+u.length,0);
 return {units,moved,nodePeople,activeMeeting,nextMeeting,liveMeetings,first,skipped,byes,available,empty:empty(),absent:[...absent]};
}

function symbolConflicts(){const uses=new Map();data.teams.forEach((t,ti)=>derive(t,ti).liveMeetings.forEach(id=>{const k=String(t.meetings[id].symbol||'').trim();if(k){if(!uses.has(k))uses.set(k,[]);uses.get(k).push([ti,id])}}));return [...uses.values()].filter(a=>a.length>1)}
function renderNotices(){

 }

 });

  const id=Number(el.dataset.inlineLocation);

function field(label,key,value,multi=false,description=''){return `<label class="field">${label}${description?`<span class="desc">${description}</span>`:''}${multi?`<textarea data-field="${key}" rows="3">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}</label>`}
function locationOptions(ti,id){
 const m=data.teams[ti].meetings[id],r=roundOf(id),cap=ROUND_LIMIT[r],selected=String(m.location||'');

function assignLocation(ti,id,place){
 const r=roundOf(id);
 if(place&&(!PLACES.includes(place)||usesAt(r,place,ti,id).length>=ROUND_LIMIT[r]))return false;

// Exchange two meeting locations atomically, retaining each meeting's identity/symbol.
// If the requesting meeting had no place, the displaced meeting becomes unassigned.
function swapLocations(ti,id,otherTi,otherId){
 const round=roundOf(id);
 if(round!==roundOf(otherId)||ti===otherTi&&id===otherId)return false;
 const a=data.teams[ti].meetings[id],b=data.teams[otherTi].meetings[otherId];
 const oldPlace=a.location||'',newPlace=b.location||'';
 if(oldPlace===newPlace||!PLACES.includes(newPlace))return false;
 // When the requesting meeting has a location, swapping cannot overbook it.
 // Important for dormant meetings (which do not consume capacity until attendance changes).
 if(oldPlace){
  const occupants=usesAt(round,oldPlace,ti,id).filter(x=>!(x.ti===otherTi&&x.id===otherId));
  if(occupants.length>=ROUND_LIMIT[round])return false;
 }

 b.location=oldPlace;

}
function closeSwap(){ $('swapOverlay').classList.add('hidden'); }
$('swapCancel').onclick=()=>{closeSwap();render()};
$('swapOverlay').onclick=e=>{if(e.target===$('swapOverlay')){closeSwap();render()}};
function changeLocation(ti,id,place){
 const current=data.teams[ti].meetings[id].location||'';
 if(place===current){render();return}
 if(!place){data.teams[ti].meetings[id].location='';save();render();return}
 if(!PLACES.includes(place)){render();return}
 const round=roundOf(id),occupied=usesAt(round,place,ti,id);
 if(occupied.length<ROUND_LIMIT[round]){
  if(assignLocation(ti,id,place)){save();render();return}
 }
 // Full location: no disabled options. The organizer selects which meetup to exchange.
 // When only one meetup occupies the target location, swap immediately.
 if(occupied.length===1){
  const other=occupied[0];
  if(swapLocations(ti,id,other.ti,other.id)){save();render();return}
  alert('Swap unavailable: the previous location is also full.');render();return;
 }
 $('swapHelp').textContent=`${data.teams[ti].name} · ${label(id)}: swap ${current||'Unassigned'} with ${place}.`;
 $('swapChoices').innerHTML=occupied.map(({ti:ot,id:oid})=>{
  const other=data.teams[ot],who=list(derive(other,ot).nodePeople[oid]);
  return `<button type="button" class="swapChoice" data-swap="${ot}:${oid}"><strong>${esc(other.name)} · ${esc(label(oid))}</strong><br><span class="swapHint">${esc(who)}</span></button>`;
 }).join('');
 $('swapOverlay').classList.remove('hidden');
 $('swapChoices').querySelectorAll('[data-swap]').forEach(button=>button.onclick=()=>{
  const [ot,oid]=button.dataset.swap.split(':').map(Number);

function balancePairs(){const t=data.teams[active];const pairs=t.units.filter(u=>unitNames(u).length===2),singles=t.units.filter(u=>unitNames(u).length!==2);if(pairs.length>3){alert('Only up to three starting duos supported in this layout.');return}pairs.sort((a,b)=>{const rank=u=>pairSequence[active].indexOf(unitNames(u)[0]);return (rank(a)<0?99:rank(a))-(rank(b)<0?99:rank(b))});const targets=[0,4,2].slice(0,pairs.length),arr=Array(8);targets.forEach((i,j)=>arr[i]=pairs[j]);let j=0;for(let i=0;i<8;i++)if(!arr[i])arr[i]=singles[j++];t.units=arr;selection=0;reconcileLocations();save();render()}
